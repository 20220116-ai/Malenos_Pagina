<style>
:root{
  --noche:#061848; --marino:#132571; --rey:#0959C9; --cielo:#1BACE5; --bruma:#CAE0F3; --hielo:#EFF3F9;
  --tinta-marca:#132571; --cab:#FFFFFF; --banda:#061848; --banda-ink:#FFFFFF; --banda-mute:#B3C6E8;
  --paper:#F2F5FA; --card:#FFFFFF; --line:#D3DCE8; --line-2:#E6ECF4; --ink:#0F1B3D; --mute:#58658A;
  --go:#17794A; --go-bg:#DDF2E6; --warn:#8A5D00; --warn-dot:#E0A100; --warn-bg:#FFF2CC;
  --stop:#B42318; --stop-bg:#FDE3E0; --info:#0959C9; --info-bg:#E3EEFC; --focus:#0959C9; --activo:#132571;
  --plate:#FFFFFF; --plate-ink:#0F1B3D; --plate-band:#0959C9;
  --shadow:0 1px 2px rgba(6,24,72,.07);
  --f-titulo:"Montserrat","Overpass",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --tinta-marca:#E7EDF9; --cab:#0D1738; --banda:#050F2E; --rey:#2F7BE6; --hielo:#121F48; --bruma:#1C2E66;
    --paper:#0A1230; --card:#111C40; --line:#27366C; --line-2:#1B2954; --ink:#E7EDF9; --mute:#9DAACB;
    --go:#5BC98D; --go-bg:#143323; --warn:#F2C55C; --warn-dot:#E8B030; --warn-bg:#3A2C0C;
    --stop:#FF8B80; --stop-bg:#3E1B1B; --info:#6FA8F5; --info-bg:#16295A; --focus:#6FA8F5; --activo:#2F7BE6; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --tinta-marca:#E7EDF9; --cab:#0D1738; --banda:#050F2E; --rey:#2F7BE6; --hielo:#121F48; --bruma:#1C2E66;
  --paper:#0A1230; --card:#111C40; --line:#27366C; --line-2:#1B2954; --ink:#E7EDF9; --mute:#9DAACB;
  --go:#5BC98D; --go-bg:#143323; --warn:#F2C55C; --warn-dot:#E8B030; --warn-bg:#3A2C0C;
  --stop:#FF8B80; --stop-bg:#3E1B1B; --info:#6FA8F5; --info-bg:#16295A; --focus:#6FA8F5; --activo:#2F7BE6; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 "Overpass",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}

/* Cabecera corporativa */
.cab{background:var(--cab)}
.cab-in{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;padding-top:14px;padding-bottom:14px}
.logo{display:block;height:96px;width:auto;background:#fff;border-radius:10px}
.titulo{border-left:1px solid var(--line);padding-left:22px;min-width:0}
.sistema{font-size:14px;font-weight:600;color:var(--rey)}
.ruta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:2px}
.ruta h1{font-family:var(--f-titulo);font-weight:800;font-style:italic;font-size:clamp(28px,4vw,42px);line-height:1.08;color:var(--tinta-marca);letter-spacing:-.01em}
.ruta h1 .sep{display:inline-block;width:.75em;height:5px;background:var(--cielo);vertical-align:middle;margin:0 .25em .14em;border-radius:3px;transform:skewX(-20deg)}
.km{border:1.5px solid var(--line);color:var(--mute);border-radius:4px;padding:2px 8px 0;font-weight:600;font-size:13.5px}
.fecha{margin-top:4px;color:var(--mute);font-size:14.5px}
.reloj{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.reloj .hora{font-family:var(--f-titulo);font-weight:800;font-size:clamp(32px,4.6vw,48px);line-height:1;color:var(--tinta-marca)}
.reloj label,.reloj .sub{font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center}
.reloj input{background:var(--hielo);border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:3px 6px 1px}
.franja{display:grid;grid-template-columns:7fr 3fr;height:5px}
.franja i:nth-child(1){background:#0959C9} .franja i:nth-child(2){background:#1BACE5}
.resumen{background:var(--banda);color:var(--banda-ink)}
.estado-dia{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.estado-dia > div{padding:12px 16px 13px 0}
.estado-dia > div + div{border-left:1px solid rgba(255,255,255,.14);padding-left:16px}
.estado-dia h2{font-size:13px;font-weight:600;color:var(--banda-mute)}
.estado-dia p{font-size:15px;margin-top:3px}
.estado-dia b{font-family:var(--f-titulo);font-weight:800}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 5px 1px 0;vertical-align:middle}
.d-ok{background:#3DBE73}.d-medir{background:#F2B33D}.d-no{background:#F0645A}.d-gris{background:#8090A6}
@media (max-width:720px){
  .cab-in{grid-template-columns:auto 1fr;gap:10px 14px;padding-top:10px;padding-bottom:12px}
  .logo{height:62px}
  .titulo{grid-column:1/-1;grid-row:2;border-left:0;padding-left:0}
  .reloj{justify-self:end}
  .estado-dia{grid-template-columns:1fr 1fr}
  .estado-dia > div{padding:9px 10px 10px 0}
  .estado-dia > div + div{border-left:0;padding-left:0}
  .estado-dia p{font-size:13.5px}
  .tabs-bar{position:static}
  .acciones .largo{display:none}
  .acciones .corto{display:inline}
}
.demo{background:var(--warn-bg);color:var(--warn);font-size:13.5px;border-bottom:1px solid var(--line)}
.demo .wrap{padding-top:7px;padding-bottom:6px}

/* Pie */
.pie{background:var(--card);border-top:1px solid var(--line)}
.pie-in{display:flex;gap:16px;align-items:center;padding-top:18px;padding-bottom:22px;flex-wrap:wrap}
.logo-pie{height:54px;width:auto;border-radius:6px;background:#fff;border:1px solid var(--line-2)}
.lema{font-family:var(--f-titulo);font-weight:800;font-style:italic;color:var(--rey);font-size:15px}
.pie .sub{max-width:80ch;color:var(--mute);font-size:13px}

@media print{
  .tabs-bar .acciones,.demo,.velo,.drawer,.toast,#reloj-ctrl,.filtros .buscar{display:none!important}
  .tabs-bar{position:static}
  body{background:#fff}
  .resumen,.franja,.pill,.bus,.sal{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bus,.turno,.panel,.kpi,.req,.zona{break-inside:avoid}
}

/* Pestañas */
.tabs-bar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tabs-bar .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:13px 12px 9px;font-weight:600;color:var(--mute);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--tinta-marca);border-bottom-color:var(--rey)}
.tab .n{font-weight:400;color:var(--mute);margin-left:4px}
.acciones{display:flex;gap:6px;padding:6px 0;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 11px 4px;font-size:14px;font-weight:600}
.btn:hover{border-color:var(--mute)}
.btn-pri{background:var(--rey);border-color:var(--rey);color:#fff}
.btn-pri:hover{background:var(--marino);border-color:var(--marino)}
.btn-sm{padding:4px 9px 2px;font-size:13px}
.corto{display:none}
.btn-go{background:var(--go-bg);border-color:transparent;color:var(--go)}
.btn-stop{background:var(--stop-bg);border-color:transparent;color:var(--stop)}
.lnk-placa{border:0;background:none;padding:0;vertical-align:middle}
.btn-link{border:0;background:none;color:var(--info);padding:0;font-weight:600;text-decoration:underline;text-underline-offset:2px}

main{padding:24px 0 48px}
.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.intro h2{font-family:var(--f-titulo);font-size:22px;font-weight:800;color:var(--tinta-marca)}
.intro p{color:var(--mute);max-width:70ch}
.filtros{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 18px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px 3px;font-size:14px;font-weight:600;color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--activo);border-color:var(--activo);color:#fff}
.buscar{margin-left:auto;min-width:220px;flex:0 1 280px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 10px 5px}
@media (max-width:640px){.buscar{margin-left:0;flex:1 1 100%}}

/* Grupos y tarjetas de bus */
.grupo{margin-bottom:26px}
.grupo h3{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:2px}
.grupo h3 .c{font-weight:400;color:var(--mute);margin-left:6px}
.grid-buses{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px}
.bus{display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);border-left:5px solid var(--go);
  background:var(--card);border-radius:8px;padding:12px 12px 11px;box-shadow:var(--shadow);min-width:0}
.bus:hover{border-color:var(--mute)}
.bus.e-medir{border-left-color:var(--warn-dot)}
.bus.e-no{border-left-color:var(--stop)}
.bus-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.bus-top .placa{flex:0 0 auto}
.placa{display:inline-flex;flex-direction:column;background:var(--plate);color:var(--plate-ink);border:2px solid var(--plate-ink);
  border-radius:5px;min-width:104px;overflow:hidden;line-height:1}
.placa .pais{background:var(--plate-band);color:#fff;font-size:8.5px;font-weight:800;letter-spacing:.18em;text-align:center;padding:2px 0 1px}
.placa .num{font-weight:800;font-size:19px;letter-spacing:.06em;text-align:center;padding:5px 8px 3px;white-space:nowrap}
.placa.sm{min-width:78px;border-width:1.5px}
.placa.sm .num{font-size:14px;padding:3px 6px 2px}
.placa.sm .pais{font-size:7px}
.bus-id{text-align:right;font-size:13px;color:var(--mute)}
.bus-id b{display:block;color:var(--ink);font-size:16px}
.est{font-weight:800;font-size:15px}
.e-ok .est{color:var(--go)} .e-medir .est{color:var(--warn)} .e-no .est{color:var(--stop)}
.razon{font-size:13.5px;color:var(--ink)}
.razon.mute{color:var(--mute)}
.aviso{font-size:13px;color:var(--warn);display:flex;gap:6px}
.aviso::before{content:"";flex:0 0 7px;height:7px;border-radius:50%;background:var(--warn-dot);margin-top:5px}
.tarde{color:var(--stop);font-weight:600}
.vacio{border:1px dashed var(--line);border-radius:8px;padding:22px;color:var(--mute);text-align:center}

/* Pills */
.pill{display:inline-block;border-radius:4px;padding:2px 7px 0;font-size:12.5px;font-weight:800;white-space:nowrap}
.p-ok{background:var(--go-bg);color:var(--go)} .p-obs{background:var(--warn-bg);color:var(--warn)}
.p-bloq{background:var(--stop-bg);color:var(--stop)} .p-info{background:var(--info-bg);color:var(--info)}
.p-gris{background:var(--line-2);color:var(--mute)}

/* Conductores */
.tabla{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabla th{font-size:13px;font-weight:600;color:var(--mute);text-align:left;padding:10px 12px 8px;border-bottom:1px solid var(--line);background:var(--hielo)}
.tabla td{padding:10px 12px 8px;border-bottom:1px solid var(--line-2);vertical-align:top;font-size:14px}
.tabla tr:last-child td{border-bottom:0}
.tabla tbody tr{cursor:pointer}
.tabla tbody tr:hover td{background:var(--paper)}
.cod{font-weight:800}
.sub{color:var(--mute);font-size:13px}
@media (max-width:760px){
  .tabla thead{display:none}
  .tabla, .tabla tbody, .tabla tr, .tabla td{display:block;width:100%}
  .tabla tr{border-bottom:1px solid var(--line);padding:8px 0}
  .tabla td{border:0;padding:3px 12px}
}

/* Rol de salidas */
.rol{display:flex;flex-direction:column;gap:8px}
.turno{display:grid;grid-template-columns:76px 140px minmax(150px,1.1fr) 140px 140px minmax(270px,1.5fr);gap:12px;align-items:start;
  background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px 10px}
.turno.act{border-left:5px solid var(--warn-dot)}
.turno.bloq{border-left:5px solid var(--stop)}
.turno.np{opacity:.7}
.t-id b{font-size:17px;font-weight:800;display:block}
.t-h{font-size:12.5px;color:var(--mute);display:block;margin-bottom:3px}
.salidas{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sal{border:1px solid var(--line-2);border-radius:6px;padding:4px 6px 3px;font-size:13px;min-width:0}
.sal .prog{display:block;color:var(--mute);font-size:12px}
.sal input{width:100%;border:0;background:transparent;padding:0;font-weight:800;font-size:14px;letter-spacing:0}
.sal input::-webkit-calendar-picker-indicator{display:none}
.sal.cumple{background:var(--go-bg)} .sal.falla{background:var(--stop-bg)}
.sal button{width:100%;margin-top:2px}
.desv{font-size:12px;font-weight:600}
@media (max-width:1100px){
  .turno{grid-template-columns:repeat(2,minmax(0,1fr))}
  .turno .t-sal{grid-column:1/-1}
}

/* Alertas */
.dos{display:grid;grid-template-columns:1.15fr .85fr;gap:22px}
@media (max-width:900px){.dos{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;box-shadow:var(--shadow)}
.panel h3{font-family:var(--f-titulo);font-size:16px;font-weight:700;margin-bottom:4px;color:var(--tinta-marca)}
.panel > p.sub{margin-bottom:10px}
.lista{list-style:none;margin:0;padding:0}
.lista li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:9px 0 7px;border-top:1px solid var(--line-2)}
.lista li:first-child{border-top:0}
.lista .pill{align-self:start}
.lista .q{grid-column:2;font-size:13.5px}
.subgrupo{font-size:13px;font-weight:800;color:var(--mute);margin:14px 0 2px}
pre.correo{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line-2);border-radius:6px;padding:12px;font:13px/1.5 "Overpass",system-ui,sans-serif;max-height:340px;overflow:auto;margin:10px 0 0}

/* Indicadores */
.kpis{display:flex;flex-direction:column;gap:12px}
.kpi{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:18px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
@media (max-width:760px){.kpi{grid-template-columns:1fr}}
.kpi h3{font-family:var(--f-titulo);font-size:15.5px;font-weight:700;color:var(--tinta-marca)}
.kpi .f{font-size:12.5px;color:var(--mute);margin-top:4px}
.escala{position:relative;height:86px;margin:0 8px}
.escala .eje{position:absolute;left:0;right:0;top:34px;height:2px;background:var(--line)}
.escala .tick{position:absolute;top:66px;font-size:11px;color:var(--mute);transform:translateX(-50%)}
.escala .tick::before{content:"";position:absolute;left:50%;top:-30px;width:1px;height:6px;background:var(--line)}
.marca{position:absolute;top:27px;width:0;display:flex;flex-direction:column;align-items:center}
.marca i{display:block;flex:0 0 auto;width:16px;height:16px;border-radius:50%;border:2px solid var(--card)}
.marca span{position:absolute;bottom:22px;left:0;transform:translateX(-50%);font-size:12px;font-weight:800;white-space:nowrap}
.marca.der span{transform:translateX(-92%)}
.marca.izq span{transform:translateX(-8%)}
.m-asis i{background:var(--mute)} .m-pil{z-index:1} .m-hoy{z-index:2} .m-pil i{background:var(--card);border:2.5px solid var(--info);border-radius:3px;transform:rotate(45deg);width:13px;height:13px;margin-top:1px}
.m-hoy i{background:var(--go)} .m-hoy.bajo i{background:var(--stop)}
.m-meta{top:19px} .m-meta i{width:3px;height:32px;border-radius:2px;background:var(--ink);border:0}
.m-meta span{bottom:auto;top:-18px;font-weight:600}
.leyenda{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin:0 0 14px}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-block;width:11px;height:11px;border-radius:50%}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:16px}
.cifras div{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--rey);border-radius:8px;padding:12px 14px 10px}
.cifras b{display:block;font-family:var(--f-titulo);font-size:22px;font-weight:800;color:var(--tinta-marca)}
.cifras span{font-size:13px;color:var(--mute)}

/* Proceso */
.bizagi{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow-x:auto;padding:8px}
.bizagi svg{display:block;min-width:1080px;width:100%;height:auto}
.ciclo{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}
@media (max-width:900px){.ciclo{grid-template-columns:1fr}}
.ciclo ol{list-style:none;margin:0;padding:0;counter-reset:paso}
.ciclo li{counter-increment:paso;display:grid;grid-template-columns:34px 1fr;gap:4px 10px;padding:10px 0 8px;border-top:1px solid var(--line-2)}
.ciclo li::before{content:counter(paso);grid-row:1/3;width:28px;height:28px;border-radius:50%;background:var(--noche);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;padding-top:2px;font-size:14px}
.ciclo li.robot::before{background:var(--cielo);color:#061848}
.ciclo .quien{font-size:13px;color:var(--mute)}
.ciclo .hoy{grid-column:2;font-size:13.5px}

/* Panel lateral */
.velo{position:fixed;inset:0;background:rgba(10,20,36,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--paper);z-index:21;display:flex;flex-direction:column;
  box-shadow:-8px 0 30px rgba(10,20,36,.25)}
.drawer[hidden],.velo[hidden]{display:none}
.dr-head{background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px 12px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.dr-head h2{font-family:var(--f-titulo);font-size:20px;font-weight:800;color:var(--tinta-marca)}
.dr-head .placa{flex:0 0 auto}
.dr-body{overflow-y:auto;padding:16px;flex:1}
.dr-sec{margin-bottom:22px}
.dr-sec > h3{font-size:15px;font-weight:800;margin-bottom:8px}
.req{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 12px 7px;background:var(--card);border:1px solid var(--line-2);border-radius:6px;margin-bottom:6px}
.req .b{grid-column:1/-1;font-size:12px;color:var(--mute)}
.req .v{font-size:13px;color:var(--mute)}
.req .pill{align-self:start;justify-self:end}
.zona{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
.zona h4{margin:0;font-size:14px;font-weight:800;padding:9px 12px 7px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:9px 12px 8px;border-top:1px solid var(--line-2)}
.item:first-of-type{border-top:0}
.item .t{font-size:14px}
.item .r{font-size:12px;color:var(--mute)}
.item.critico .t::after{content:" · crítico";color:var(--stop);font-size:12px;font-weight:600}
.item.s-ROJO{background:var(--stop-bg)} .item.s-AMARILLO{background:var(--warn-bg)}
.item.s-PENDIENTE .t{font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:5px 10px 3px;font-size:13px;font-weight:600}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].si{background:var(--go);color:#fff}
.seg button[aria-pressed="true"].no{background:var(--stop);color:#fff}
.num-in{display:flex;align-items:center;gap:6px}
.num-in input{width:82px;border:1px solid var(--line);border-radius:6px;padding:5px 7px 3px;background:var(--card);text-align:right}
.num-in span{font-size:13px;color:var(--mute)}
.resultado{border-radius:8px;padding:12px 14px 10px;margin-bottom:12px}
.resultado.r-ok{background:var(--go-bg)} .resultado.r-obs{background:var(--warn-bg)} .resultado.r-bloq{background:var(--stop-bg)}
.resultado b{display:block;font-size:16px}
.resultado ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}
.barra-envio{position:sticky;bottom:-16px;margin-bottom:-16px;background:var(--paper);padding:10px 0 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px 8px;border-radius:8px;z-index:30;font-weight:600;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.drawer{animation:entra .18s ease-out}@keyframes entra{from{transform:translateX(24px);opacity:.6}}}

<script>
"use strict";
let D = JSON.parse(document.getElementById("datos").textContent);
let REQB, REQC, ITEMS, BUS, COND, TURNOS, T, KEY, R;
let relojManual = null, vista = "buses", abierto = null, borrador = {};
const filtro = {buses: "todos", conductores: "todos", rol: "accion", qb: "", qc: ""};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const min = (h) => { const [a, b] = String(h).split(":").map(Number); return a * 60 + b; };
const hhmm = (m) => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const pct = (v) => v == null ? "—" : v.toFixed(2).replace(".", ",") + " %";
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

function preparar() {
  REQB = Object.fromEntries(D.req_bus.map((r) => [r.id, r]));
  REQC = Object.fromEntries(D.req_conductor.map((r) => [r.id, r]));
  ITEMS = D.checklist.flatMap((z) => z.items.map((it) => ({...it, zona: z.zona})));
  BUS = Object.fromEntries(D.buses.map((b) => [b.codigo, b]));
  COND = Object.fromEntries(D.conductores.map((c) => [c.codigo, c]));
  TURNOS = [...D.turnos].sort((a, b) => min(a.inicio) - min(b.inicio));
  T = Object.fromEntries(TURNOS.map((t) => [t.id, t]));
  KEY = "despacho:" + D.meta.fecha_operacion + (D.meta.demo ? ":demo" : "");
  R = cargarRegistros();
  relojManual = D.meta.demo ? min(D.meta.reloj || "09:30") : null;
}
function vacios() { return {presentaciones: {}, checklists: {}, cambios_bus: {}, salidas: {}}; }
function cargarRegistros() {
  const base = Object.assign(vacios(), JSON.parse(JSON.stringify(D.registros || {})));
  try {
    const g = localStorage.getItem(KEY);
    if (g) return Object.assign(vacios(), JSON.parse(g));
  } catch (e) { /* sin almacenamiento: se trabaja en memoria */ }
  return base;
}
function guardar() { try { localStorage.setItem(KEY, JSON.stringify(R)); } catch (e) { /* en memoria */ } }

function ahora() {
  if (relojManual != null) return relojManual;
  const d = new Date();
  const f = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  if (f === D.meta.fecha_operacion) return d.getHours() * 60 + d.getMinutes();
  return f < D.meta.fecha_operacion ? 0 : 24 * 60 - 1;
}

/* ---------- Lógica del Día D (misma que en Python) ---------- */
function evalItem(it, v) {
  if (v == null || v === "") return "PENDIENTE";
  if (it.tipo === "ok") return ["SI", "SÍ", "OK", "CONFORME", "TRUE"].includes(String(v).toUpperCase()) || v === true ? "OK" : (it.critico ? "ROJO" : "AMARILLO");
  const n = parseFloat(String(v).replace(",", "."));
  if (isNaN(n)) return "PENDIENTE";
  if (it.min_rojo != null && n < it.min_rojo) return "ROJO";
  if (it.min_amarillo != null && n < it.min_amarillo) return "AMARILLO";
  if (it.max_amarillo != null && n > it.max_amarillo) return "AMARILLO";
  return "OK";
}
function evalChecklist(resp) {
  const pendientes = [], rojos = [], amarillos = [];
  for (const it of ITEMS) {
    const r = evalItem(it, (resp || {})[it.id]);
    if (r === "PENDIENTE") pendientes.push(it); else if (r === "ROJO") rojos.push(it); else if (r === "AMARILLO") amarillos.push(it);
  }
  const estado = rojos.length ? "BLOQUEADO" : (pendientes.length ? "INCOMPLETO" : "CONFORME");
  return {estado, pendientes, rojos, amarillos, avance: ITEMS.length - pendientes.length, total: ITEMS.length};
}
function busEfectivo(tid) { return (R.cambios_bus[tid] || {}).bus || T[tid].bus; }
function presencia() {
  const consumidos = new Set(), res = {};
  for (const t of TURNOS) {
    let reserva = t.reserva;
    if (reserva && consumidos.has(reserva)) reserva = D.reten_disponibles.find((r) => !consumidos.has(r)) || null;
    const p = R.presentaciones[t.id];
    let conductor = t.programado ? t.titular : null, entro = false;
    if (t.programado && p && p.estado === "AUSENTE") {
      conductor = reserva || null;
      if (reserva) { entro = true; consumidos.add(reserva); reserva = null; }
    }
    res[t.id] = {conductor, reserva, entro_reserva: entro, registrado: !!p, hora: p ? p.hora : null, estado: p ? p.estado : null,
      confirmado: !!p && (p.estado === "PRESENTE" || entro)};
  }
  return res;
}
function robot4(pres) {
  const hojas = {};
  for (const t of TURNOS) {
    const p = pres[t.id], bus = busEfectivo(t.id), ch = bus ? R.checklists[bus] : null;
    const ec = evalChecklist(ch ? ch.respuestas : {}), motivos = [];
    let estado;
    if (!t.programado || !bus) { estado = "NO PROGRAMADO"; motivos.push("Turno no programado en el cierre D-1"); }
    else if (!BUS[bus].eval.apto) { estado = "NO PROGRAMADO"; motivos.push(...BUS[bus].eval.faltantes); }
    else if (ec.estado === "BLOQUEADO") { estado = "BLOQUEADA"; motivos.push(...ec.rojos.map((i) => "No conforme: " + i.texto.toLowerCase())); }
    else if (p.conductor == null) { estado = "SIN CONDUCTOR"; motivos.push("Titular ausente y sin reserva disponible"); }
    else {
      if (!ch) motivos.push("Checklist no enviado");
      else if (ec.estado === "INCOMPLETO") motivos.push("Falta medir o verificar: " + ec.pendientes.map((i) => i.texto).join(", "));
      if (!p.confirmado) motivos.push("Conductor sin confirmar en el rol");
      else if (!COND[p.conductor].eval.apto) motivos.push("Conductor no apto");
      estado = motivos.length ? "PENDIENTE" : "EMITIDA";
    }
    hojas[t.id] = {estado, motivos, bus, checklist: ec, numero: estado === "EMITIDA" ? "HR-" + D.meta.fecha_operacion.replaceAll("-", "") + "-" + t.id : null};
  }
  return hojas;
}
function kpis(pres, reloj) {
  const TOL = D.meta.tolerancia_min, inc = {cobertura: 0, documental: 0, frecuencia: 0, checklist: 0};
  let prog = 0, falla = 0, noEjec = 0;
  for (const t of TURNOS) {
    const p = pres[t.id], bus = busEfectivo(t.id), evb = bus ? BUS[bus].eval : null;
    const sinBus = !t.programado && (t.causa_no_programado === "C2" || t.causa_no_programado === "C5");
    const c2 = (sinBus && t.causa_no_programado === "C2") || (evb && !evb.apto_documental);
    const c5 = (sinBus && t.causa_no_programado === "C5") || (evb && evb.apto_documental && !evb.apto);
    const ch = bus ? R.checklists[bus] : null, ec = evalChecklist(ch ? ch.respuestas : {});
    const bloq = ec.estado === "BLOQUEADO";
    const f1 = p.conductor == null && !c2 && !c5;
    const f2 = !!c2 || (p.conductor != null && !COND[p.conductor].eval.apto_documental);
    for (const s of t.salidas) {
      prog++;
      let f3 = false, f4 = false;
      const hs = min(s.hora);
      if (hs <= reloj && !(f1 || f2 || c5 || bloq)) {
        const envio = ch && ch.hora_envio ? min(ch.hora_envio) : null;
        f4 = ec.estado !== "CONFORME" || envio == null || envio > hs;
        if (!f4) { const real = R.salidas[s.id]; f3 = real ? Math.abs(min(real) - hs) > TOL : reloj > hs + TOL; }
      }
      if ((c5 || bloq) && !f2) noEjec++;
      if (f1) inc.cobertura++; if (f2) inc.documental++; if (f3) inc.frecuencia++; if (f4) inc.checklist++;
      if (f1 || f2 || f3 || f4) falla++;
    }
  }
  const out = {viajes_programados: prog, no_ejecutados_c5: noEjec, viajes_con_falla: falla, ifs: prog ? 100 * falla / prog : 0};
  for (const k in inc) { out[k] = prog ? 100 * (1 - inc[k] / prog) : 0; out["inc_" + k] = inc[k]; }
  return out;
}

/* ---------- Estado consolidado de buses y conductores ---------- */
let S = null;
function calcular() {
  const reloj = ahora(), pres = presencia(), hojas = robot4(pres), k = kpis(pres, reloj);
  const turnoDeBus = {}, retirado = {};
  for (const t of TURNOS) { const b = busEfectivo(t.id); if (b && t.programado) turnoDeBus[b] = t.id; }
  for (const tid in R.cambios_bus) retirado[T[tid].bus] = tid;
  const buses = {};
  for (const b of D.buses) {
    const ev = b.eval, ch = R.checklists[b.codigo], ec = evalChecklist(ch ? ch.respuestas : {});
    const tid = turnoDeBus[b.codigo] || null;
    let estado, razones = [], rol;
    if (tid) rol = {tipo: "turno", tid, texto: "Turno " + tid, hora: T[tid].inicio};
    else if (retirado[b.codigo]) rol = {tipo: "retirado", texto: "Retirado de " + retirado[b.codigo]};
    else if (D.buses_reserva.includes(b.codigo)) rol = {tipo: "reserva", texto: "Bus de reserva"};
    else rol = {tipo: "fuera", texto: b.turno_habitual ? "Fuera del rol" : "Reserva"};
    const limite = tid ? min(T[tid].inicio) - D.meta.minutos_checklist_antes : null;
    const atrasado = tid && limite != null && reloj > limite && ec.estado !== "CONFORME";
    if (!ev.apto) { estado = "no"; razones = ev.faltantes; }
    else if (ec.estado === "BLOQUEADO") { estado = "no"; razones = ec.rojos.map((i) => "No conforme: " + i.texto.toLowerCase() + valorTxt(i, ch.respuestas[i.id])); }
    else if (ec.estado !== "CONFORME") {
      estado = "medir";
      const num = ec.pendientes.filter((i) => i.tipo === "num");
      if (!ch) razones = [rol.tipo === "turno" ? "Checklist sin enviar: " + ITEMS.length + " ítems, " + ITEMS.filter((i) => i.tipo === "num").length + " con medición"
        : "Checklist sin enviar: se inspecciona cuando reemplaza a un bus del rol"];
      else razones = ["Falta medir: " + (num.length ? num.map((i) => corto(i.texto)).join(", ") : "—") +
        (ec.pendientes.length > num.length ? ". Falta verificar: " + ec.pendientes.filter((i) => i.tipo !== "num").map((i) => corto(i.texto)).join(", ") : "")];
    } else estado = "ok";
    const avisos = [...ev.alertas, ...ec.amarillos.map((i) => i.texto + valorTxt(i, ch.respuestas[i.id]))];
    buses[b.codigo] = {estado, razones, avisos, rol, ch, ec, atrasado, limite, hoja: tid ? hojas[tid] : null};
  }
  const roles = {};
  for (const t of TURNOS) {
    const p = pres[t.id];
    if (p.conductor) roles[p.conductor] = {tipo: "conduce", texto: "Conduce " + t.id + (p.entro_reserva ? " como reserva" : ""), tid: t.id};
    if (t.titular && p.estado === "AUSENTE") roles[t.titular] = {tipo: "ausente", texto: "Ausente en " + t.id};
  }
  for (const t of TURNOS) {
    const p = pres[t.id];
    if (p.reserva && !roles[p.reserva]) roles[p.reserva] = {tipo: "reserva", texto: "Reserva desde " + t.inicio};
  }
  const conductores = {};
  for (const c of D.conductores) {
    const rol = roles[c.codigo] || (c.no_disponible ? {tipo: "nd", texto: capital(c.no_disponible.split(":")[0])} : {tipo: "libre", texto: "Libre"});
    conductores[c.codigo] = {nivel: c.eval.nivel, rol};
  }
  S = {reloj, pres, hojas, kpi: k, buses, conductores};
}
const capital = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
function corto(t) { return t.replace(/^Neumático /, "neum. ").replace(/^Presión de aire de frenos/, "presión de aire").replace(/^Tiempo de carga de aire.*/, "tiempo de carga de aire").toLowerCase(); }
function valorTxt(it, v) { return it.tipo === "num" && v != null && v !== "" ? " (" + String(v).replace(".", ",") + " " + it.unidad + ")" : ""; }

/* ---------- Render ---------- */
const VISTAS = [["buses", "Buses"], ["conductores", "Conductores"], ["rol", "Rol de salidas"], ["alertas", "Alertas"], ["kpi", "Indicadores"], ["proceso", "Proceso RPA"]];

}

}

function cuenta(arr) { const o = {}; for (const x of arr) o[x] = (o[x] || 0) + 1; return o; }

/* Buses */
const EST_BUS = {ok: "Operativo", medir: "Falta medir", no: "No operativo"};
function vBuses() {
  const q = filtro.qb.trim().toLowerCase();

    return !q || (b.codigo + " " + b.placa + " " + (s.rol.tid || "")).toLowerCase().includes(q);
  });
  const c = cuenta(Object.values(S.buses).map((b) => b.estado)), nav = Object.values(S.buses).filter((b) => b.avisos.length).length;
  const chips = [["todos", "Todos", D.buses.length], ["no", "No operativos", c.no || 0], ["medir", "Falta medir", c.medir || 0], ["ok", "Operativos", c.ok || 0], ["avisos", "Con avisos", nav]];
  let html = `<div class="intro"><div><h2>¿Qué buses pueden salir?</h2><p>Un bus está operativo cuando sus documentos están vigentes (Robot 2), no tiene alerta roja del PdM y su checklist pre-viaje está completo y conforme (Robot 4). Toque un bus para ver sus documentos o llenar el checklist.</p></div></div>
  <div class="filtros">${chips.map(([id, t, n]) => `<button class="chip" aria-pressed="${filtro.buses === id}" data-act="fb" data-id="${id}">${t} ${n}</button>`).join("")}

  const grupos = filtro.buses === "todos" || filtro.buses === "avisos" ? [["no", "No operativos"], ["medir", "Falta medir"], ["ok", "Operativos"]] : [[filtro.buses, EST_BUS[filtro.buses]]];
  for (const [e, titulo] of grupos) {
    const g = lista.filter((b) => S.buses[b.codigo].estado === e);

function placa(p, sm) { return `<span class="placa${sm ? " sm" : ""}" aria-label="Placa ${esc(p)}"><span class="pais">PERÚ</span><span class="num">${esc(p)}</span></span>`; }

/* Conductores */
const NIV = {ok: ["Apto", "p-ok"], obs: ["Apto con aviso", "p-obs"], bloq: ["No apto", "p-bloq"]};
const TIPO = {LINEA: "Línea", RELEVO: "Relevo", RETEN: "Retén"};
function vConductores() {
  const q = filtro.qc.trim().toLowerCase();
  const c = cuenta(D.conductores.map((x) => x.eval.nivel));
  const chips = [["todos", "Todos", D.conductores.length], ["bloq", "No aptos", c.bloq || 0], ["obs", "Con aviso", c.obs || 0], ["ok", "Aptos", c.ok || 0]];
  const orden = {bloq: 0, obs: 1, ok: 2};
  const lista = D.conductores.filter((x) => (filtro.conductores === "todos" || x.eval.nivel === filtro.conductores) &&
    (!q || (x.codigo + " " + x.nombres + " " + x.licencia_categoria).toLowerCase().includes(q)))
    .sort((a, b) => orden[a.eval.nivel] - orden[b.eval.nivel] || a.codigo.localeCompare(b.codigo));
  let html = `<div class="intro"><div><h2>¿Qué conductores tienen sus documentos en regla?</h2><p>El Robot 2 revisa la licencia (categoría, vigencia y estado), el récord de puntos, las infracciones muy graves, el examen médico, la habilitación ante el MTC y la capacitación. Un requisito vencido o no cumplido vuelve “no apto” al conductor y el Robot 1 no lo asigna.</p></div></div>
  <div class="filtros">${chips.map(([id, t, n]) => `<button class="chip" aria-pressed="${filtro.conductores === id}" data-act="fc" data-id="${id}">${t} ${n}</button>`).join("")}
  <input class="buscar" type="search" placeholder="Buscar nombre, código o licencia" value="${esc(filtro.qc)}" data-in="qc" aria-label="Buscar conductor"></div>`;
  if (!lista.length) { $("#vista").innerHTML = html + `<p class="vacio">Ningún conductor coincide con el filtro.</p>`; return; }
  html += `<table class="tabla"><thead><tr><th>Conductor</th><th>Licencia</th><th>Documentos</th><th>Qué falta o vence</th><th>Hoy</th></tr></thead><tbody>`;
  for (const x of lista) {
    const [t, cl] = NIV[x.eval.nivel], s = S.conductores[x.codigo];

      <td>${esc(x.licencia_categoria)}<div class="sub">${x.puntos_firmes != null ? Math.round(x.puntos_firmes) + " puntos" : ""}</div></td>
      <td><span class="pill ${cl}">${t}</span></td>
      <td>${det.length ? det.map((d) => `<div>${esc(d)}</div>`).join("") : '<span class="sub">Todo vigente</span>'}</td>
      <td>${esc(s.rol.texto)}</td></tr>`;
  }
  $("#vista").innerHTML = html + "</tbody></table>";
}

/* Rol de salidas */
function requiereAccion(t) {
  const h = S.hojas[t.id];
  if (["PENDIENTE", "BLOQUEADA", "SIN CONDUCTOR"].includes(h.estado)) return true;
  return h.estado === "EMITIDA" && t.salidas.some((s) => min(s.hora) <= S.reloj && !R.salidas[s.id]);
}
const HOJA = {EMITIDA: "p-ok", PENDIENTE: "p-obs", BLOQUEADA: "p-bloq", "SIN CONDUCTOR": "p-bloq", "NO PROGRAMADO": "p-gris"};
function vRol() {
  const n = {accion: TURNOS.filter(requiereAccion).length, todos: TURNOS.length};
  n.emitidas = TURNOS.filter((t) => S.hojas[t.id].estado === "EMITIDA").length;
  let html = `<div class="intro"><div><h2>Rol de salidas del día</h2><p>Registre la presentación de cada conductor (actividad 5). El Robot 4 emite la hoja de ruta cuando el checklist está conforme y el conductor confirmó (actividad 7). Al salir el bus, registre la hora real (actividad 8); la tolerancia es de ±${D.meta.tolerancia_min} minutos.</p></div></div>
  <div class="filtros">${[["accion", "Requieren acción"], ["todos", "Todos"], ["emitidas", "Hoja emitida"]].map(([id, t]) => `<button class="chip" aria-pressed="${filtro.rol === id}" data-act="fr" data-id="${id}">${t} ${n[id]}</button>`).join("")}</div>`;
  const lista = TURNOS.filter((t) => filtro.rol === "todos" || (filtro.rol === "accion" ? requiereAccion(t) : S.hojas[t.id].estado === "EMITIDA"));
  if (!lista.length) { $("#vista").innerHTML = html + `<p class="vacio">No hay turnos que requieran acción a las ${hhmm(S.reloj)}.</p>`; return; }
  html += `<div class="rol">` + lista.map(filaTurno).join("") + `</div>`;
  $("#vista").innerHTML = html;
}
function filaTurno(t) {
  const h = S.hojas[t.id], p = S.pres[t.id], bus = h.bus, cambio = R.cambios_bus[t.id];
  const cls = h.estado === "BLOQUEADA" || h.estado === "SIN CONDUCTOR" ? "bloq" : (requiereAccion(t) ? "act" : "");
  let busH = bus ? `<button class="lnk-placa" data-act="bus" data-id="${bus}" aria-label="Abrir ${bus}">${placa(BUS[bus].placa, true)}</button> <span class="sub">${bus}</span>` : `<span class="sub">Sin bus apto</span>`;
  if (cambio) busH += `<div class="sub">Reemplaza a ${T[t.id].bus}: ${esc(cambio.motivo || "")}</div>`;
  else if (t.origen_bus === "reserva") busH += `<div class="sub">Reserva asignada por el Robot 3 (${t.bus_plan} no apto)</div>`;
  let condH = "—";
  if (p.conductor) { const c = COND[p.conductor]; condH = `<button class="btn-link" data-act="cond" data-id="${c.codigo}">${c.codigo}</button> ${esc(c.nombres)}<div class="sub">${p.entro_reserva ? "Reserva: el titular " + t.titular + " no se presentó" : (t.origen_titular && t.origen_titular !== "habitual" ? "Cubre como " + t.origen_titular : "Titular habitual")}</div>`; }
  if (t.programado && p.reserva && !p.entro_reserva) condH += `<div class="sub">Reserva: ${p.reserva}</div>`;
  let presH = '<span class="sub">—</span>';
  if (t.programado && t.titular) {
    presH = p.registrado ? `<span class="pill ${p.estado === "PRESENTE" ? "p-ok" : "p-obs"}">${p.estado === "PRESENTE" ? "Presente" : "Ausente"} ${esc(p.hora || "")}</span> <button class="btn-link" data-act="pres-borrar" data-id="${t.id}">deshacer</button>`
      : `<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-sm btn-go" data-act="pres" data-id="${t.id}" data-v="PRESENTE">Presente</button><button class="btn btn-sm btn-stop" data-act="pres" data-id="${t.id}" data-v="AUSENTE">No llegó</button></div>`;
  }
  const ec = h.checklist;
  let chkH = '<span class="sub">—</span>';
  if (bus && t.programado) {
    const ch = R.checklists[bus];
    chkH = !ch ? `<button class="btn btn-sm" data-act="bus" data-id="${bus}">Llenar checklist</button>`
      : `<span class="pill ${ec.estado === "CONFORME" ? "p-ok" : ec.estado === "BLOQUEADO" ? "p-bloq" : "p-obs"}">${ec.estado === "CONFORME" ? "Conforme" : ec.estado === "BLOQUEADO" ? "Crítico no conforme" : "Falta medir " + ec.pendientes.length}</span><div class="sub">enviado ${esc(ch.hora_envio)}</div>`;
  }
  let hojaH = `<span class="pill ${HOJA[h.estado]}">${h.estado === "EMITIDA" ? "Emitida" : capital(h.estado.toLowerCase())}</span>`;
  if (h.numero) hojaH += `<div class="sub">${h.numero}</div>`;
  else if (h.motivos.length && h.estado !== "NO PROGRAMADO") hojaH += `<div class="sub">${esc(h.motivos[0])}</div>`;
  if (h.estado === "BLOQUEADA") {
    const libre = reservaLibre();
    hojaH += libre ? `<button class="btn btn-sm btn-pri" style="margin-top:6px" data-act="reserva-bus" data-id="${t.id}">Asignar ${libre}</button>` : `<div class="sub tarde">No quedan buses de reserva aptos</div>`;
  }
  const sal = t.salidas.map((s) => celdaSalida(t, s, h)).join("");
  return `<article class="turno ${cls} ${t.programado ? "" : "np"}">
    <div class="t-id"><span class="t-h">Turno</span><b>${t.id}</b><span class="sub">${t.inicio} a ${t.fin}</span></div>
    <div><span class="t-h">Bus</span>${busH}</div>
    <div><span class="t-h">Conductor</span>${condH}</div>
    <div><span class="t-h">Presentación</span>${presH}</div>
    <div><span class="t-h">Checklist y hoja de ruta</span>${chkH}<div style="margin-top:6px">${hojaH}</div></div>
    <div class="t-sal"><span class="t-h">Salidas (programada / real)</span><div class="salidas">${sal}</div></div></article>`;
}
function celdaSalida(t, s, h) {
  const real = R.salidas[s.id], TOL = D.meta.tolerancia_min, hs = min(s.hora);
  if (real) {
    const d = min(real) - hs, ok = Math.abs(d) <= TOL;
    return `<div class="sal ${ok ? "cumple" : "falla"}"><span class="prog">${s.n}. ${s.hora} ${s.origen.slice(0, 4)}</span><input type="time" value="${real}" data-in="salida" data-id="${s.id}" aria-label="Hora real de la salida ${s.id}"><span class="desv">${d > 0 ? "+" : ""}${d} min</span></div>`;
  }
  const puede = h.estado === "EMITIDA" && hs - 30 <= S.reloj;
  const vencida = hs + TOL < S.reloj;
  return `<div class="sal"><span class="prog">${s.n}. ${s.hora} ${s.origen.slice(0, 4)}</span>${puede ? `<button class="btn btn-sm ${vencida ? "btn-stop" : ""}" data-act="salida" data-id="${s.id}">Salió</button>` : `<span class="sub">${vencida && h.estado !== "EMITIDA" ? "sin hoja" : "—"}</span>`}</div>`;
}
function reservaLibre() {
  const usados = new Set(TURNOS.map((t) => busEfectivo(t.id)));
  return D.buses_reserva.find((b) => !usados.has(b) && evalChecklist((R.checklists[b] || {}).respuestas).estado !== "BLOQUEADO") || null;
}

/* Alertas */
function vAlertas() {
  const g = [["No aptos", (a) => a.nivel === "bloq"], ["Vencen en 7 días o menos", (a) => a.estado === "ALERTA 7"], ["Vencen en 15 días o menos", (a) => a.estado === "ALERTA 15"],
    ["Vencen en 30 días o menos", (a) => a.estado === "ALERTA 30"], ["Otras observaciones", (a) => a.estado === "OBSERVADO" || a.estado === "AMARILLO"]];
  let izq = `<div class="panel"><h3>Avisos del Robot 2</h3><p class="sub">Revisión de vigencia hecha en el cierre del ${D.meta.fecha_cierre.split("-").reverse().join("/")} para el Día D.</p>`;
  for (const [tit, f] of g) {
    const l = D.alertas.filter(f);
    if (!l.length) continue;

  }

}

      ${ticks.map((t) => `<span class="tick" style="left:${x(t)}%">${t}</span>`).join("")}

    <div><b>${pct(k.ifs)}</b><span>Índice de Fallas en el Servicio hoy (C1 a C4)</span></div>

function abrir(tipo, id, refresco) {
  abierto = {tipo, id};
  if (!refresco && tipo === "bus") borrador = JSON.parse(JSON.stringify((R.checklists[id] || {}).respuestas || {}));
  if (tipo === "bus") panelBus(id); else panelConductor(id);
  const dr = $("#drawer");

}
function cerrar() {
  const prev = abierto; abierto = null;
  $("#drawer").hidden = true; $("#velo").hidden = true; document.body.style.overflow = "";
  const el = prev && document.querySelector(`[data-act="${prev.tipo === "bus" ? "bus" : "cond"}"][data-id="${prev.id}"]`);
  if (el) el.focus();
}
function filaReq(r, def) {
  const cl = r.nivel === "bloq" ? "p-bloq" : r.nivel === "obs" ? "p-obs" : "p-ok";
  const est = r.nivel === "ok" ? "Vigente" : (r.texto || r.estado).split(": ").slice(1).join(": ") || r.estado;
  let val = r.valor;
  if (typeof val === "boolean") val = val ? "Sí" : "No";
  if (typeof val === "string" && /^\d{4}-\d\d-\d\d$/.test(val)) val = val.split("-").reverse().join("/");
  return `<div class="req"><strong>${esc(def.nombre)}</strong><span class="pill ${cl}">${esc(capital(est))}</span><span class="v">${val == null || val === "" ? "Sin dato" : esc(val)}</span><span></span><span class="b">${esc(def.base)}</span></div>`;
}
function resultadoBus(id) {
  const b = BUS[id], s = S.buses[id], ec = evalChecklist(borrador);
  let res;
  if (!b.eval.apto) res = ["r-bloq", "No operativo por documentos o PdM", b.eval.faltantes];
  else if (ec.estado === "BLOQUEADO") res = ["r-bloq", "El bus no sale: hay ítems críticos no conformes", ec.rojos.map((i) => i.texto + valorTxt(i, borrador[i.id]))];
  else if (ec.estado === "INCOMPLETO") res = ["r-obs", `Falta medir o verificar ${ec.pendientes.length} de ${ec.total} ítems`, ec.pendientes.map((i) => i.texto)];
  else res = ["r-ok", ec.amarillos.length ? "Conforme, sale con observaciones" : "Checklist conforme", ec.amarillos.map((i) => i.texto + valorTxt(i, borrador[i.id]) + ": programar intervención")];
  const enviado = R.checklists[id], cambiado = JSON.stringify((enviado || {}).respuestas || {}) !== JSON.stringify(limpio(borrador));
  let html = `<div class="resultado ${res[0]}"><b>${res[1]}</b>${res[2].length ? `<ul>${res[2].slice(0, 8).map((x) => `<li>${esc(x)}</li>`).join("")}${res[2].length > 8 ? `<li>y ${res[2].length - 8} más</li>` : ""}</ul>` : ""}</div>`;
  if (b.eval.apto && cambiado) html += `<p class="sub" style="margin:-4px 0 14px">Cambios sin enviar: el Robot 4 evalúa el checklist cuando lo envía.</p>`;
  else if (s.hoja) {
    const otros = s.hoja.motivos.filter((m) => !/^(Falta medir|Checklist no enviado|No conforme)/.test(m));
    html += `<p class="sub" style="margin:-4px 0 14px">Hoja de ruta del ${s.rol.tid}: <strong>${s.hoja.numero || capital(s.hoja.estado.toLowerCase())}</strong>${otros.length ? ". " + esc(otros.join(". ")) : ""}</p>`;
  }
  return html;
}

function descargar(nombre, texto, tipo) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([texto], {type: tipo})); a.download = nombre;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) { if (e.target.id === "velo") cerrar(); return; }
  const id = el.dataset.id, act = el.dataset.act, hora = hhmm(ahora());
  switch (act) {
    case "vista": vista = id; try { localStorage.setItem("despacho:vista", id); } catch (x) {} render(); window.scrollTo(0, 0); break;
    case "fb": filtro.buses = id; render(); break;
    case "fc": filtro.conductores = id; render(); break;
    case "fr": filtro.rol = id; render(); break;
    case "bus": abrir("bus", id); break;
    case "cond": abrir("cond", id); break;
    case "cerrar": cerrar(); break;
    case "pres": R.presentaciones[id] = {estado: el.dataset.v, hora}; guardar(); render();
      aviso(el.dataset.v === "PRESENTE" ? `${id}: conductor presente a las ${hora}` : `${id}: ingresa ${S.pres[id].conductor || "nadie (sin reserva)"}`); break;
    case "pres-borrar": delete R.presentaciones[id]; guardar(); render(); break;
    case "item": {
      borrador[id] = el.dataset.v;
      el.parentElement.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === el)));
      marcarItem(ITEMS.find((i) => i.id === id)); refrescarPanel(); break; }
    case "completar": for (const it of ITEMS) if (it.tipo === "ok" && borrador[it.id] == null) borrador[it.id] = "SI"; abrir("bus", id, true); break;
    case "enviar": {
      const tid = S.buses[id].rol.tid;
      borrador = limpio(borrador);
      R.checklists[id] = {hora_envio: hora, conductor: tid ? S.pres[tid].conductor : null, respuestas: {...borrador}};
      guardar(); render();
      const ec = evalChecklist(borrador), h = tid ? S.hojas[tid] : null;
      aviso(ec.estado === "BLOQUEADO" ? `Robot 4: ${id} no sale. Aviso enviado a taller.` : ec.estado === "INCOMPLETO" ? `Robot 4: faltan ${ec.pendientes.length} ítems en ${id}` : h && h.estado === "EMITIDA" ? `Robot 4: hoja de ruta ${h.numero} emitida` : `Robot 4: checklist conforme. ${h ? h.motivos.join(". ") : "Bus listo como reserva."}`);
      break; }
    case "reserva-bus": {
      const libre = reservaLibre(); if (!libre) break;
      R.cambios_bus[id] = {bus: libre, hora, motivo: busEfectivo(id) + " bloqueado por ítem crítico"}; guardar(); render();
      aviso(`${id} sale con ${libre}. Falta su checklist.`); break; }
    case "salida": R.salidas[id] = hora; guardar(); render(); break;
    case "exportar": descargar(`registros_${D.meta.fecha_operacion}.json`, JSON.stringify({fecha: D.meta.fecha_operacion, ...R}, null, 1), "application/json");
      aviso("Registros descargados. Úselos con: --registros"); break;
    case "csv": descargar(`estado_${D.meta.fecha_operacion}.csv`, csv(), "text/csv"); break;
    case "abrir": $("#archivo").click(); break;
    case "copiar": try { navigator.clipboard.writeText(D.correo).then(() => aviso("Correo copiado"), () => aviso("No se pudo copiar: seleccione el texto")); } catch (x) { aviso("No se pudo copiar: seleccione el texto"); } break;
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && abierto) cerrar();
  if (e.key === "Enter" && e.target.matches("tr[data-act]")) abrir("cond", e.target.dataset.id);
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.dataset.in === "item") { borrador[el.dataset.id] = el.value === "" ? null : el.value; marcarItem(ITEMS.find((i) => i.id === el.dataset.id)); refrescarPanel(); return; }
  if (el.dataset.in === "qb" || el.dataset.in === "qc") {
    filtro[el.dataset.in] = el.value; const pos = el.selectionStart; render();
    const n = document.querySelector(`[data-in="${el.dataset.in}"]`); if (n) { n.focus(); n.setSelectionRange(pos, pos); }
  }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.in === "salida") { if (el.value) R.salidas[el.dataset.id] = el.value; else delete R.salidas[el.dataset.id]; guardar(); render(); }
  if (el.id === "reloj-in" && el.value) { relojManual = min(el.value); render(); }
  if (el.id === "archivo" && el.files[0]) {
    el.files[0].text().then((txt) => {
      const j = JSON.parse(txt);
      if (j.meta && j.buses && j.turnos) { D = j; abierto = null; preparar(); render(); aviso("Datos del " + D.meta.fecha_operacion + " cargados"); }
      else if (j.presentaciones || j.checklists) { R = Object.assign(vacios(), j); delete R.fecha; guardar(); render(); aviso("Registros cargados"); }
      else aviso("El archivo no es datos_despacho.json ni un archivo de registros");
    }).catch(() => aviso("No se pudo leer el archivo: debe ser JSON")).finally(() => (el.value = ""));
  }
});
function csv() {
  const filas = [["recurso", "codigo", "nombre_o_placa", "estado", "rol_hoy", "detalle"]];
  for (const b of D.buses) { const s = S.buses[b.codigo]; filas.push(["bus", b.codigo, b.placa, EST_BUS[s.estado], s.rol.texto, [...s.razones, ...s.avisos].join(" | ")]); }
  for (const c of D.conductores) filas.push(["conductor", c.codigo, c.nombres, NIV[c.eval.nivel][0], S.conductores[c.codigo].rol.texto, [...c.eval.faltantes, ...c.eval.alertas].join(" | ")]);
  return "﻿" + filas.map((f) => f.map((x) => `"${String(x ?? "").replace(/"/g, '""')}"`).join(";")).join("\r\n");
}

preparar();
try { const v = localStorage.getItem("despacho:vista"); if (v && VISTAS.some((x) => x[0] === v)) vista = v; } catch (e) {}
render();
if (relojManual == null) setInterval(() => { if (!abierto) render(); else { calcular(); cabecera(); } }, 30000);
</script>
